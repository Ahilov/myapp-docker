version: '3.8'

services:
  app:
    build: .
    container_name: my-python-app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=secret
    depends_on:
      - db
    networks:
      - mynet

  db:
    image: postgres:15
    container_name: my-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynet

  web:
    image: nginx:latest
    container_name: my-nginx
    ports:
      - "8080:80"
    networks:
      - mynet

volumes:
  pgdata:

networks:
  mynet:
    driver: bridge
